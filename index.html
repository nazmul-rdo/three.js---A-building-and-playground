<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Building and Playground</title>

    <style>

        body {
            margin: 0;
            overflow: hidden;
        }

    </style>

</head>

<body>

<script src="js/three.js"></script>

<script>

const scene = new THREE.Scene();
scene.background =
    new THREE.Color(0x87ceeb);

const renderer = new THREE.WebGLRenderer();

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);

// Camera
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(
    10,
    6,
    12
);

camera.lookAt(
    0,
    2,
    0
);

// Building
const buildingGroup = new THREE.Group();

// Main building
const geometry = new THREE.BoxGeometry(
    4,
    6,
    4
);

const textureLoader = new THREE.TextureLoader();

const buildingTexture = textureLoader.load(
    './textures/building1.jpg'
);

// Custom shader
const material = new THREE.ShaderMaterial({

    uniforms: {

        buildingTexture: {
            value: buildingTexture
        }

    },

    vertexShader: `

        varying vec2 vUv;

        void main() {

            vUv = uv;

            gl_Position =
                projectionMatrix *
                modelViewMatrix *
                vec4(position, 1.0);

        }

    `,

    fragmentShader: `

        uniform sampler2D buildingTexture;

        varying vec2 vUv;

        void main() {

            gl_FragColor =
                texture2D(
                    buildingTexture,
                    vUv
                );

        }

    `

});

const building = new THREE.Mesh(
    geometry,
    material
);

building.position.y = 3;

buildingGroup.add(
    building
);

const roofGeometry = new THREE.ConeGeometry(
    3,
    2,
    4
);

const roofMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x8B4513

    });

const roof = new THREE.Mesh(
    roofGeometry,
    roofMaterial
);

roof.position.y = 7;

roof.rotation.y = Math.PI / 4;

buildingGroup.add(
    roof
);

const doorGeometry = new THREE.BoxGeometry(
    1,
    2,
    0.2
);

const doorMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x4B2E1E

    });

const door = new THREE.Mesh(
    doorGeometry,
    doorMaterial
);

door.position.set(
    0,
    1,
    2.1
);

const glassGeometry = new THREE.BoxGeometry(
    0.55,
    0.65,
    0.05
);

const glassMaterial = new THREE.MeshStandardMaterial({
    color: 0x87CEEB,
    metalness: 0.2,
    roughness: 0.2
});

const glass = new THREE.Mesh(
    glassGeometry,
    glassMaterial
);

glass.position.set(
    0,
    1.35,
    2.22
);

buildingGroup.add(glass);

const handleGeometry = new THREE.SphereGeometry(
    0.08,
    16,
    16
);

const handleMaterial = new THREE.MeshStandardMaterial({
    color: 0xFFD700,
    metalness: 0.8,
    roughness: 0.2
});

const handle = new THREE.Mesh(
    handleGeometry,
    handleMaterial
);

handle.position.set(
    0.32,
    0.9,
    2.25
);

buildingGroup.add(handle);

// Road
const pathGroup = new THREE.Group();

const roadGeometry = new THREE.PlaneGeometry(2.5, 10);

const roadMaterial = new THREE.MeshStandardMaterial({
    color: 0x555555,
    roughness: 0.9,
    side: THREE.DoubleSide
});

const road = new THREE.Mesh(
    roadGeometry,
    roadMaterial
);

road.rotation.x = -Math.PI / 2;

road.position.set(
    0,
    0.03,
    7
);

road.receiveShadow = true;

pathGroup.add(road);

const borderGeometry = new THREE.PlaneGeometry(0.25, 10);

const borderMaterial = new THREE.MeshStandardMaterial({
    color: 0xC2B280,
    side: THREE.DoubleSide
});

const leftBorder = new THREE.Mesh(
    borderGeometry,
    borderMaterial
);

leftBorder.rotation.x = -Math.PI / 2;

leftBorder.position.set(
    -1.4,
    0.04,
    7
);

leftBorder.receiveShadow = true;

pathGroup.add(leftBorder);

const rightBorder = new THREE.Mesh(
    borderGeometry,
    borderMaterial
);

rightBorder.rotation.x = -Math.PI / 2;

rightBorder.position.set(
    1.4,
    0.04,
    7
);

rightBorder.receiveShadow = true;

pathGroup.add(rightBorder);

scene.add(pathGroup);

buildingGroup.add(
    door
);

// Windows
const windowGeometry = new THREE.BoxGeometry(
    1,
    1,
    0.2
);

const windowMaterial =
    new THREE.MeshStandardMaterial({

        color: 0x87CEEB

    });

const windowFrameMaterial = new THREE.MeshStandardMaterial({
    color: 0x3A2415
});

const windowGlassMaterial = new THREE.MeshStandardMaterial({
    color: 0x87CEEB,
    metalness: 0.3,
    roughness: 0.2
});

const frame1 = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 1.5, 0.18),
    windowFrameMaterial
);

frame1.position.set(-1.2, 4, 2.12);

buildingGroup.add(frame1);

const panel1Left = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 1.2, 0.06),
    windowGlassMaterial
);

panel1Left.position.set(
    -1.5,
    4,
    2.23
);

buildingGroup.add(panel1Left);

const panel1Right = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 1.2, 0.06),
    windowGlassMaterial
);

panel1Right.position.set(
    -0.9,
    4,
    2.23
);

buildingGroup.add(panel1Right);

const middleFrame1 = new THREE.Mesh(
    new THREE.BoxGeometry(0.08, 1.3, 0.08),
    windowFrameMaterial
);

middleFrame1.position.set(
    -1.2,
    4,
    2.27
);

buildingGroup.add(middleFrame1);

const frame2 = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 1.5, 0.18),
    windowFrameMaterial
);

frame2.position.set(1.2, 4, 2.12);

buildingGroup.add(frame2);

const panel2Left = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 1.2, 0.06),
    windowGlassMaterial
);

panel2Left.position.set(
    0.9,
    4,
    2.23
);

buildingGroup.add(panel2Left);

const panel2Right = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 1.2, 0.06),
    windowGlassMaterial
);

panel2Right.position.set(
    1.5,
    4,
    2.23
);

panel2Right.rotation.y = -Math.PI / 4;

buildingGroup.add(panel2Right);

const middleFrame2 = new THREE.Mesh(
    new THREE.BoxGeometry(0.08, 1.3, 0.08),
    windowFrameMaterial
);

middleFrame2.position.set(
    1.2,
    4,
    2.27
);

buildingGroup.add(middleFrame2);

scene.add(
    buildingGroup
);

// Playground
const playgroundGeometry =
    new THREE.PlaneGeometry(
        20,
        20
    );

const playgroundTexture =
    textureLoader.load(
        './textures/playground.jpg'
    );

const playgroundMaterial =
    new THREE.MeshStandardMaterial({

        map: playgroundTexture,

        side: THREE.DoubleSide

    });

const playground = new THREE.Mesh(
    playgroundGeometry,
    playgroundMaterial
);

playground.rotation.x =
    -Math.PI / 2;

scene.add(
    playground
);

// Boundary and gate
const fenceMaterial = new THREE.MeshStandardMaterial({
    color: 0x6B4F35
});

function createFencePost(x, z) {

    const postGeometry = new THREE.BoxGeometry(
        0.2,
        1.2,
        0.2
    );

    const post = new THREE.Mesh(
        postGeometry,
        fenceMaterial
    );

    post.position.set(
        x,
        0.6,
        z
    );

    post.castShadow = true;

    scene.add(post);
}

function createFence(x, z, width, rotationY) {

    const fenceGeometry = new THREE.BoxGeometry(
        width,
        0.15,
        0.15
    );

    const fence = new THREE.Mesh(
        fenceGeometry,
        fenceMaterial
    );

    fence.position.set(
        x,
        0.7,
        z
    );

    fence.rotation.y = rotationY;

    fence.castShadow = true;

    scene.add(fence);
}

createFence(
    0,
    -9.5,
    19,
    0
);

createFence(
    -9.5,
    0,
    19,
    Math.PI / 2
);

createFence(
    9.5,
    0,
    19,
    Math.PI / 2
);

createFence(
    -5.5,
    9.5,
    8,
    0
);

createFence(
    5.5,
    9.5,
    8,
    0
);

for (let i = -9; i <= 9; i += 3) {

    createFencePost(
        i,
        -9.5
    );

}

for (let i = -6; i <= 6; i += 3) {

    createFencePost(
        -9.5,
        i
    );

}

for (let i = -6; i <= 6; i += 3) {

    createFencePost(
        9.5,
        i
    );

}

for (let i = -9; i <= 9; i += 3) {

    if (i < -2 || i > 2) {

        createFencePost(
            i,
            9.5
        );

    }

}

const gatePostMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x3A2415
    });

const gatePostGeometry =
    new THREE.BoxGeometry(
        0.35,
        2,
        0.35
    );

const leftGatePost =
    new THREE.Mesh(
        gatePostGeometry,
        gatePostMaterial
    );

leftGatePost.position.set(
    -2,
    1,
    9.5
);

leftGatePost.castShadow = true;

scene.add(
    leftGatePost
);

const rightGatePost =
    new THREE.Mesh(
        gatePostGeometry,
        gatePostMaterial
    );

rightGatePost.position.set(
    2,
    1,
    9.5
);

rightGatePost.castShadow = true;

scene.add(
    rightGatePost
);

const gateTopGeometry =
    new THREE.BoxGeometry(
        4.35,
        0.3,
        0.35
    );

const gateTop =
    new THREE.Mesh(
        gateTopGeometry,
        gatePostMaterial
    );

gateTop.position.set(
    0,
    1.9,
    9.5
);

gateTop.castShadow = true;

scene.add(
    gateTop
);

const gateMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x4B2E1E,
        roughness: 0.6
    });

const leftGate =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.8,
            1.5,
            0.15
        ),

        gateMaterial

    );

leftGate.position.set(
    -1,
    0.8,
    9.5
);

leftGate.castShadow = true;

scene.add(
    leftGate
);

const rightGate =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.8,
            1.5,
            0.15
        ),

        gateMaterial

    );

rightGate.position.set(
    1,
    0.8,
    9.5
);

rightGate.castShadow = true;

scene.add(
    rightGate
);

// Badminton court
const badmintonFloorGeometry =
    new THREE.PlaneGeometry(5, 7);

const badmintonFloorMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x3A7D44,
        side: THREE.DoubleSide
    });

const badmintonFloor =
    new THREE.Mesh(
        badmintonFloorGeometry,
        badmintonFloorMaterial
    );

badmintonFloor.rotation.x =
    -Math.PI / 2;

badmintonFloor.position.set(
    5.5,
    0.05,
    0
);

badmintonFloor.receiveShadow = true;

scene.add(badmintonFloor);

const lineMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xFFFFFF
    });

const sideLineGeometry =
    new THREE.BoxGeometry(
        0.06,
        0.03,
        7
    );

const leftLine =
    new THREE.Mesh(
        sideLineGeometry,
        lineMaterial
    );

leftLine.position.set(
    3,
    0.08,
    0
);

scene.add(leftLine);

const rightLine =
    new THREE.Mesh(
        sideLineGeometry,
        lineMaterial
    );

rightLine.position.set(
    8,
    0.08,
    0
);

scene.add(rightLine);

const endLineGeometry =
    new THREE.BoxGeometry(
        5,
        0.03,
        0.06
    );

const frontLine =
    new THREE.Mesh(
        endLineGeometry,
        lineMaterial
    );

frontLine.position.set(
    5.5,
    0.08,
    -3.5
);

scene.add(frontLine);

const backLine =
    new THREE.Mesh(
        endLineGeometry,
        lineMaterial
    );

backLine.position.set(
    5.5,
    0.08,
    3.5
);

scene.add(backLine);

const netPostMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x222222
    });

const netPostGeometry =
    new THREE.CylinderGeometry(
        0.06,
        0.06,
        1.6,
        16
    );

const leftNetPost =
    new THREE.Mesh(
        netPostGeometry,
        netPostMaterial
    );

leftNetPost.position.set(
    3,
    0.8,
    0
);

leftNetPost.castShadow = true;

scene.add(leftNetPost);

const rightNetPost =
    new THREE.Mesh(
        netPostGeometry,
        netPostMaterial
    );

rightNetPost.position.set(
    8,
    0.8,
    0
);

rightNetPost.castShadow = true;

scene.add(rightNetPost);

const netGeometry =
    new THREE.BoxGeometry(
        5,
        1.2,
        0.04
    );

const netMaterial =
    new THREE.MeshBasicMaterial({
        color: 0x222222,
        transparent: true,
        opacity: 0.6
    });

const badmintonNet =
    new THREE.Mesh(
        netGeometry,
        netMaterial
    );

badmintonNet.position.set(
    5.5,
    0.8,
    0
);

scene.add(badmintonNet);

// Sun
const sunGeometry = new THREE.SphereGeometry(
    1,
    32,
    32
);

const sunMaterial = new THREE.MeshBasicMaterial({
    color: 0xFFFF00
});

const sun = new THREE.Mesh(
    sunGeometry,
    sunMaterial
);

scene.add(sun);

// Lighting
const light =
    new THREE.DirectionalLight(
        0xffffff,
        1
    );

const ambientLight = new THREE.AmbientLight(
    0xffffff,
    0.5
);

scene.add(ambientLight);

light.position.set(
    5,
    10,
    5
);

scene.add(
    light
);

sun.position.copy(light.position);

// Keyboard control
document.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "w") {

            camera.position.z -= 0.5;

        }

        if (event.key === "s") {

            camera.position.z += 0.5;

        }

        if (event.key === "a") {

            camera.position.x -= 0.5;

        }

        if (event.key === "d") {

            camera.position.x += 0.5;

        }

        camera.lookAt(
            0,
            2,
            0
        );

    }
);

// Mouse drag camera control
let isDragging = false;

let previousMouseX = 0;
let previousMouseY = 0;

let cameraAngle = 0;
let cameraHeight = 7;

document.addEventListener("mousedown", function(event) {

    isDragging = true;

    previousMouseX = event.clientX;
    previousMouseY = event.clientY;
});

document.addEventListener("mouseup", function() {

    isDragging = false;
});

document.addEventListener("mousemove", function(event) {

    if (!isDragging) return;

    const mouseX = event.clientX;
    const mouseY = event.clientY;

    const movementX = mouseX - previousMouseX;
    const movementY = mouseY - previousMouseY;

    cameraAngle -= movementX * 0.005;

    cameraHeight += movementY * 0.03;

    cameraHeight = Math.max(3, Math.min(15, cameraHeight));

    const distance = 12;

    camera.position.x =
        Math.sin(cameraAngle) * distance;

    camera.position.z =
        Math.cos(cameraAngle) * distance;

    camera.position.y =
        cameraHeight;

    camera.lookAt(0, 2, 0);

    previousMouseX = mouseX;
    previousMouseY = mouseY;
});

// Mouse click texture change
let textureChanged = false;

document.addEventListener(
    "click",
    function () {

        if (textureChanged === false) {

            building.material.uniforms
                .buildingTexture.value =
                textureLoader.load(
                    "./textures/building2.jpg"
                );

            textureChanged = true;

        } else {

            building.material.uniforms
                .buildingTexture.value =
                textureLoader.load(
                    "./textures/building1.jpg"
                );

            textureChanged = false;

        }

    }
);

// Animation
let angle = 0;

function animate() {

    requestAnimationFrame(animate);

    angle += 0.01;

    light.position.x =
        Math.cos(angle) * 8;

    light.position.z =
        Math.sin(angle) * 8;

    light.position.y =
        Math.sin(angle) * 10 + 2;

    sun.position.copy(light.position);

    light.lookAt(1, 2, 0);

    if (light.position.y > 3) {

        light.intensity = 2;
        ambientLight.intensity = 0.5;

    } else {

        light.intensity = 0;
        ambientLight.intensity = 0.5;
    }

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>

</body>

</html>
